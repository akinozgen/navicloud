# NaviCloud — Flatpak manifesti (BAŞLANGIÇ / WIP).
#
# Durum: app + JRE (release tarball'ından) /app'e kurulur. libmpv Flatpak
# runtime'ında YOK; ses için bir libmpv sağlanmalı. En temiz yol: aşağıdaki
# "libmpv" modülünü kaynaktan derlemek (ffmpeg runtime uzantısından gelir) ya
# da io.mpv.Mpv gibi bir kaynağı referanslamak. Bu manifest flatpak-builder ile
# derlenir; libmpv modülü dağıtım/runtime sürümüne göre ince ayar isteyebilir.
# (deb/rpm/AppImage/AUR üretimi doğrulanmıştır; Flatpak henüz build-verify edilmedi.)
app-id: io.github.akinozgen.NaviCloud
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: navicloud

finish-args:
  - --share=network                 # Navidrome sunucusuna erişim
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio             # ses çıkışı
  - --device=dri                    # GPU (Compose/Skiko render)
  - --talk-name=org.freedesktop.Notifications
  # LAN uzaktan kumanda + mDNS için (opsiyonel):
  # - --share=network zaten yeterli; mDNS için ek izin gerekebilir.

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    autodelete: false

modules:
  # libmpv — ffmpeg-full uzantısına karşı derlenir. (Sürüme göre meson opsiyonları
  # ayarlanmalı; libplacebo vb. alt bağımlılıklar gerekebilir. Bu blok iskelet.)
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplugins=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.38.0
    # NOT: mpv'nin ffmpeg/libplacebo bağımlılıkları runtime/ffmpeg-full'dan
    # çözülmezse ek modüller (libplacebo, shaderc) eklemek gerekebilir.

  # NaviCloud uygulaması (release linux tarball'ı → /app)
  - name: navicloud
    buildsystem: simple
    build-commands:
      - mkdir -p /app/navicloud
      - cp -a navicloud/. /app/navicloud/
      - install -Dm755 navicloud.wrapper /app/bin/navicloud
      - install -Dm644 navicloud/navicloud.png /app/share/icons/hicolor/256x256/apps/io.github.akinozgen.NaviCloud.png
      - install -Dm644 io.github.akinozgen.NaviCloud.desktop /app/share/applications/io.github.akinozgen.NaviCloud.desktop
    sources:
      - type: archive
        url: https://github.com/akinozgen/navicloud/releases/download/v1.5.1/NaviCloud-1.5.1-linux-x86_64.tar.gz
        sha256: REPLACE_WITH_TARBALL_SHA256
      - type: script
        dest-filename: navicloud.wrapper
        commands:
          - '#!/bin/sh'
          - 'exec /app/navicloud/bin/NaviCloud "$@"'
      - type: file
        path: io.github.akinozgen.NaviCloud.desktop
